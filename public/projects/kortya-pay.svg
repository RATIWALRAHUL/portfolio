<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#064E3B"/>
  <circle cx="650" cy="180" r="240" fill="#10B981" fill-opacity="0.3"/>
  <circle cx="150" cy="450" r="220" fill="#EDA23F" fill-opacity="0.25"/>
  <g transform="translate(250, 60)">
    <!-- Mobile phone frame -->
    <rect width="300" height="480" rx="40" fill="#022C22" stroke="#10B981" stroke-opacity="0.4" stroke-width="3"/>
    <!-- Dynamic Island / Top bar -->
    <rect x="100" y="16" width="100" height="20" rx="10" fill="#064E3B"/>
    <!-- Wallet Card -->
    <rect x="25" y="60" width="250" height="130" rx="20" fill="#047857"/>
    <rect x="45" y="80" width="80" height="12" rx="6" fill="#A7F3D0"/>
    <rect x="45" y="100" width="140" height="24" rx="6" fill="#FFFFFF"/>
    <rect x="45" y="145" width="90" height="28" rx="14" fill="#EDA23F"/>
    <rect x="145" y="145" width="90" height="28" rx="14" fill="#022C22"/>
    <!-- Quick Actions (Scan QR, Send, Bank, Bill) -->
    <g transform="translate(25, 210)">
      <circle cx="28" cy="28" r="24" fill="#064E3B"/>
      <rect x="18" y="18" width="20" height="20" rx="4" fill="#10B981"/>
      <circle cx="92" cy="28" r="24" fill="#064E3B"/>
      <circle cx="156" cy="28" r="24" fill="#064E3B"/>
      <circle cx="220" cy="28" r="24" fill="#064E3B"/>
    </g>
    <!-- Recent Transactions List -->
    <rect x="25" y="290" width="250" height="160" rx="20" fill="#064E3B"/>
    <rect x="40" y="310" width="120" height="12" rx="6" fill="#A7F3D0"/>
    <rect x="40" y="335" width="220" height="30" rx="8" fill="#022C22"/>
    <rect x="40" y="375" width="220" height="30" rx="8" fill="#022C22"/>
    <rect x="40" y="415" width="220" height="20" rx="6" fill="#022C22"/>
  </g>
</svg>
